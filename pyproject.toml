[tool.black]
line-length = 120

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dispyro"
dynamic = ["version"]
authors = [
  { name = "asteroid-den", email = "denbartolomee@gmail.com" },
]
description = "Improved dispatching for Pyrogram"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "kurigram>=2.2",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/asteroid-den/dispyro"
Repository = "https://github.com/asteroid-den/dispyro"

[tool.hatch.version]
path = "dispyro/__init__.py"
pattern = '__version__ = "(?P<version>[^"]+)"'